[project]
name = "knowledge-base"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "colorlog>=6.12.0",
    "fastapi>=0.141.1",
    "grandalf>=0.8",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "markdown-it-py>=4.2.0",
    "minio>=7.2.20",
    "numpy>=2.4.6",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "torch>=2.12.1",
    #    "torchvision>=0.26.0",
    #    "torchaudio>=2.11.0",
    "flagembedding>=1.3.5",
    "transformers>=4.45.0,<5.0.0",
    "modelscope>=1.39.1",
    "pymilvus[model]>=3.0.1",
    "openai-agents>=0.20.0",
    "mcp>=1.28,<2",
    "dashscope>=1.26.7",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]

# 强制从 pytorch-cuda 源安装
[tool.uv.sources]
torch = { index = "pytorch-cuda132" }
#torchvision = { index = "pytorch-cuda" }
#torchaudio = { index = "pytorch-cuda" }

# 定义pytorch-cuda源
[[tool.uv.index]]
name = "pytorch-cuda132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
